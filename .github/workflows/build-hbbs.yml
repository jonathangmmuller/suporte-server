name: build hbbs (Vancin)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Toolchain
        run: |
          rustup toolchain install 1.90 --profile minimal
          rustup default 1.90
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl --bin hbbs
      - uses: actions/upload-artifact@v4
        with:
          name: hbbs-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/hbbs
